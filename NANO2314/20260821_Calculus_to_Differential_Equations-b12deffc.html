  details.code-block summary::before {
    content: '\25B6';  /* right-pointing triangle */
    font-size: 0.75em;
    transition: transform 0.15s;
    display: inline-block;
  }

  details.code-block[open] summary::before {
    transform: rotate(90deg);
  }

  details.code-block pre {
    margin: 0;
    border: none;
    border-top: 1px solid var(--border);
    border-radius: 0;
    background: var(--bg);
  }

  /* ===== Collapsible sections (Wikipedia mobile-style) ===== */
  .section-controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    padding: 0.5em 0 0.6em;
    margin: 0 0 0.4em;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0.5em;
  }

  .section-controls button {
    flex: 1;
    padding: 0.4em 0.8em;
    font-size: 0.82em;
    font-weight: 600;
    color: var(--vt-maroon);
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .section-controls button:hover {
    background: var(--border);
  }

  .collapsible-section {
    margin: 0;
    padding: 0;
    border-bottom: 1px solid var(--border);
  }

  .collapsible-section:last-of-type {
    border-bottom: none;
  }

  .collapsible-section > h1 {
    cursor: pointer;
    user-select: none;
    margin: 0;
    padding: 0.7em 0 0.6em;
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.4em;
    border-bottom: none;
  }

  .collapsible-section > h1::before {
    content: '\25BC';  /* down-pointing triangle (expanded state) */
    font-size: 0.65em;
    color: var(--vt-orange);
    transition: transform 0.15s;
    display: inline-block;
  }

  .collapsible-section.collapsed > h1::before {
    transform: rotate(-90deg);  /* points right when collapsed */
  }

  .collapsible-section > h1:hover {
    color: var(--vt-orange);
  }

  /* When collapsed, hide everything inside the section except the h1 */
  .collapsible-section.collapsed > *:not(h1) {
    display: none;
  }

  .collapsible-section > *:not(h1) {
    padding-left: 0.2em;
  }
  </style>
<script>
  document.addEventListener('DOMContentLoaded', function() {

    // --- Back-to-top button ---
    var btn = document.createElement('button');
    btn.className = 'back-to-top';
    btn.innerHTML = '&uarr;';
    btn.setAttribute('aria-label', 'Back to top');
    document.body.appendChild(btn);

    window.addEventListener('scroll', function() {
      if (window.scrollY > 400) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }, { passive: true });

    btn.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // --- Collapsible sections: click h1 to toggle ---
    var sections = document.querySelectorAll('.collapsible-section > h1');
    sections.forEach(function(h1) {
      h1.addEventListener('click', function() {
        var section = h1.parentElement;
        section.classList.toggle('collapsed');
        // Scroll the section header into view when collapsing
        // (avoids the page jumping to an awkward position)
        if (section.classList.contains('collapsed')) {
          var rect = h1.getBoundingClientRect();
          if (rect.top < 0 || rect.top > window.innerHeight * 0.4) {
            h1.scrollIntoView({ block: 'start', behavior: 'smooth' });
          }
        }
      });
    });

    // --- Expand all / Collapse all controls ---
    var controls = document.querySelector('.section-controls');
    if (controls) {
      var expandBtn = controls.querySelector('[data-action="expand-all"]');
      var collapseBtn = controls.querySelector('[data-action="collapse-all"]');

      if (expandBtn) {
        expandBtn.addEventListener('click', function() {
          document.querySelectorAll('.collapsible-section')
            .forEach(function(s) { s.classList.remove('collapsed'); });
        });
      }
      if (collapseBtn) {
        collapseBtn.addEventListener('click', function() {
          document.querySelectorAll('.collapsible-section')
            .forEach(function(s) { s.classList.add('collapsed'); });
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      }
    }

    // Initialize on load
    updateProgress();
  });
  </script>
